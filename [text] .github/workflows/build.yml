[yaml]
name: Build & Release ModelCycles 6CH

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal (VST3 + AU)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build VST3 and AU
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign and package macOS bundles
        run: |
          mkdir -p dist
          find build/ModelCycles6CH_artefacts -maxdepth 3 -name "*.vst3" -exec cp -R {} dist/ \;
          find build/ModelCycles6CH_artefacts -maxdepth 3 -name "*.component" -exec cp -R {} dist/ \;

          # Ad-hoc signing obbligatorio per Apple Silicon (M1/M2/M3/M4)
          for bundle in dist/*.vst3 dist/*.component; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle"
            fi
          done

          ls -la dist
          ditto -c -k dist ModelCycles-6CH-macOS-Universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelCycles-6CH-macOS-Universal
          path: ModelCycles-6CH-macOS-Universal.zip

  build-windows:
    name: Build Windows x64 (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Windows x64)
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Package Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build/ModelCycles6CH_artefacts -Recurse -Filter "*.vst3" -Directory | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination dist/ -Recurse
          }
          Get-ChildItem dist
          Compress-Archive -Path dist/* -DestinationPath ModelCycles-6CH-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelCycles-6CH-Windows-x64
          path: ModelCycles-6CH-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [ build-macos, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: ModelCycles-6CH-macOS-Universal
          path: release_assets

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ModelCycles-6CH-Windows-x64
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/ModelCycles-6CH-macOS-Universal.zip
            release_assets/ModelCycles-6CH-Windows-x64.zip
